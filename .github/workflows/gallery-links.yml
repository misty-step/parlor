name: Gallery links

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery-links:
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check every advertised Play and Source link
        run: |
          set -o pipefail
          node scripts/check-gallery-links.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
