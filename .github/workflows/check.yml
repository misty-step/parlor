name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:all
      # This check advises on changed test evidence. It never receives a model
      # credential from PR-controlled code or replaces the check:all result.
      - name: Fetch pinned shared semantic checker
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: misty-step/harness
          ref: 4d0ce988f95df995983ade823498bd858ec52064
          path: .advisory-harness
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          bun-version: "1.4.2"
      - name: Advisory test-evidence check on exact CI snapshot
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          OPENROUTER_API_KEY: ""
          TYPESAFE_API_KEY: ""
        run: |
          if ! base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF"); then
            echo "semantic-check: comparison base unavailable; check:all result is unchanged"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          printf 'refs/heads/ci %s refs/heads/base %s\n' "$head" "$base" |
            bun .advisory-harness/agent-config/bin/semantic-check.ts --repo "$PWD" --outgoing --json --no-cache ||
            echo "semantic-check: advisory unavailable; check:all result is unchanged"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
