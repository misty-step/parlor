name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a promotion, and do not let a delayed older run replace master.
concurrency:
  group: site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and verify the candidate once
        run: |
          pnpm check:all
          pnpm check:gallery-links
          printf '%s\n' "$GITHUB_SHA" > apps/site/dist/version.txt
          pnpm --filter @parlor/site exec wrangler versions upload --env production --dry-run
      - name: Skip a superseded candidate
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            printf 'promote=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Skipping superseded candidate %s (master is %s)\n' "$GITHUB_SHA" "$head"
          fi
      - name: Promote the verified assets without changing routes
        if: steps.current.outputs.promote == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @parlor/site exec wrangler versions upload --env production --tag "$GITHUB_SHA"
          pnpm --filter @parlor/site exec wrangler versions deploy --env production --version-tag "$GITHUB_SHA@100%" --yes
      - name: Read back the shipped identity and exact public artifacts
        if: steps.current.outputs.promote == 'true'
        run: node scripts/verify-site-deploy.mjs https://parlor.mistystep.io
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site-${{ github.sha }}
          path: |
            apps/site/dist/
            test-results/
          retention-days: 14
